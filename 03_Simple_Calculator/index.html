<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>Simple Calculator</h1><input type="number" id="a" placeholder="First number"><select id="op"><option value="+">Addition (+)</option><option value="-">Subtraction (-)</option><option value="*">Multiplication (*)</option><option value="/">Division (/)</option></select><input type="number" id="b" placeholder="Second number"><button onclick="calculate()">Calculate</button><h2 id="result">Result:</h2></main>
<script>function calculate(){const a=Number(document.getElementById("a").value),b=Number(document.getElementById("b").value),op=document.getElementById("op").value;let ans;if(document.getElementById("a").value===""||document.getElementById("b").value===""){result.textContent="Enter both numbers";return;}if(op==="+")ans=a+b;else if(op==="-")ans=a-b;else if(op==="*")ans=a*b;else if(b===0){result.textContent="Cannot divide by zero";return;}else ans=a/b;result.textContent="Result: "+ans;}</script></body></html>
