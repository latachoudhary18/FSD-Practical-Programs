<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Quiz</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Online Quiz</h1><div id="quiz"></div><button onclick="submitQuiz()">Submit Quiz</button><h2 id="result"></h2></main>
<script>const questions=[{q:"HTML stands for?",o:["HyperText Markup Language","HighText Machine Language","Home Tool Markup"],a:0},{q:"Which tag creates a link?",o:["img","a","p"],a:1},{q:"Which language styles a page?",o:["CSS","SQL","Python"],a:0}];const quiz=document.getElementById("quiz");questions.forEach((item,i)=>{quiz.innerHTML+=`<p>${i+1}. ${item.q}</p>`;item.o.forEach((option,j)=>quiz.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}">${option}</label><br>`);});function submitQuiz(){let score=0;questions.forEach((q,i)=>{const selected=document.querySelector(`input[name="q${i}"]:checked`);if(selected&&Number(selected.value)===q.a)score++;});document.getElementById("result").textContent=`Your score: ${score}/${questions.length}`;}</script></body></html>
