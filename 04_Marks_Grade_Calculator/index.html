<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marks Calculator</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Student Marks Calculator</h1><div id="inputs"></div><button onclick="calculate()">Calculate Grade</button><h2 id="out"></h2></main>
<script>const box=document.getElementById("inputs");for(let i=1;i<=5;i++)box.innerHTML+=`<label>Subject ${i}<input type="number" id="m${i}" min="0" max="100"></label>`;function calculate(){let marks=[];for(let i=1;i<=5;i++){const field=document.getElementById("m"+i),v=Number(field.value);if(field.value===""||v<0||v>100){out.textContent="Enter marks from 0 to 100 in every subject.";return;}marks.push(v);}const total=marks.reduce((s,m)=>s+m,0),percent=total/5;let grade;if(marks.some(m=>m<35))grade="F";else if(percent>=90)grade="A+";else if(percent>=80)grade="A";else if(percent>=70)grade="B";else if(percent>=60)grade="C";else if(percent>=50)grade="D";else grade="E";out.textContent=`Total: ${total}/500 | Percentage: ${percent.toFixed(2)}% | Grade: ${grade}`;}</script></body></html>
