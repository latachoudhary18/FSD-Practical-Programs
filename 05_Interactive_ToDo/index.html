<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do List</title><link rel="stylesheet" href="style.css"></head><body><main><h1>To-Do List</h1><input id="task" placeholder="Enter a task"><button onclick="addTask()">Add</button><ul id="list"></ul></main>
<script>function addTask(){const input=document.getElementById("task"),text=input.value.trim();if(!text){alert("Enter a task");return;}const li=document.createElement("li"),span=document.createElement("span");span.textContent=text;span.onclick=()=>span.classList.toggle("done");const del=document.createElement("button");del.textContent="Delete";del.onclick=()=>li.remove();li.append(span,del);document.getElementById("list").appendChild(li);input.value="";}</script></body></html>
